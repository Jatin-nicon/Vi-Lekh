version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: vilekh-postgres
    restart: always
    environment:
      POSTGRES_USER: vilekh
      POSTGRES_PASSWORD: vilekh_password
      POSTGRES_DB: vilekh_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
